<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taipei Parks Explorer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">Project 03 · Full-stack</p>
    <h1><span class="mark">Taipei Parks Explorer</span></h1>
    <p class="api-note">Live data from my own Flask REST API — search, filtering and pagination are handled server-side at <code>/api/parks</code>.</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <input id="search" type="search" placeholder="Search by name, area or keyword…" autocomplete="off" />
    </div>
    <select id="type"><option value="">All types</option></select>
    <select id="area"><option value="">All districts</option></select>
  </div>

  <div class="meta" id="meta"></div>
  <div id="results"><div class="state"><span class="spinner"></span>Loading parks…</div></div>
  <div class="pager" id="pager" hidden>
    <button id="prev">‹ Prev</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="next">Next ›</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <span class="badge" id="mType"></span>
      <h3 id="mName"></h3>
      <div class="eng" id="mEng"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
