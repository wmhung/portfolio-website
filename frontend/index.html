<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet" />
  <title>Weiming Hung — Frontend Developer</title>
  <meta name="description"
    content="Portfolio of Weiming Hung, a frontend / full-stack developer in Taipei. Featuring a Taipei Parks Explorer built with React and a Flask REST API." />
  <script>
    // anti-FOUC (Flash of the wrong theme on reload)
    (function () {
      try {
        var t = localStorage.getItem("theme") || "light";
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        d.style.colorScheme = t === "dark" ? "dark" : "light";
        d.style.background = t === "dark" ? "#161616" : "#f4f4f2";
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
