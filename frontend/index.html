<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Preload the self-hosted headline font (LCP element) so it paints ASAP. -->
  <link rel="preload" href="/fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Noto Sans  is loaded on demand from src/i18n.js -->
  <title>Weiming Hung — Frontend Developer</title>

    content="Full-stack developer portfolio — React, Next.js, and Flask. Projects, skills, and contact." />
  <link rel="canonical" href="https://portfolio-weiming.vercel.app/" />
  <meta name="theme-color" content="#fbcb0a" />

  <!-- Open Graph (link previews on LinkedIn, Facebook, Slack, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Weiming Hung — Frontend Developer" />
  <meta property="og:description" content="Full-stack developer portfolio — React, Next.js, and Flask." />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Structured data: Person schema for rich results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Weiming Hung",
    "jobTitle": "Frontend Developer",
    "url": "https://portfolio-weiming.vercel.app/",
    "knowsAbout": ["React", "Next.js", "TypeScript", "Flask", "CSS"],
    "sameAs": [
      "https://github.com/wmhung"
    ]
  }
  </script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") || "light";
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        d.style.colorScheme = t === "dark" ? "dark" : "light";
        d.style.background = t === "dark" ? "#161616" : "#f4f4f2";
        var lang = localStorage.getItem("lang") || "en";
        d.setAttribute("lang", lang === "zh" ? "zh-Hant" : "en");
      } catch (e) { }
    })();
  </script>
</head>
