<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load fonts without blocking render: preload as style, then flip media to
       'all' on load so the headline (LCP) paints in a fallback immediately. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Noto+Sans+TC:wght@400;500;700&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet" />
  </noscript>
  <title>Weiming Hung — Frontend Developer</title>
  <meta name="description"
    content="Full-stack developer portfolio — React, Next.js, and Flask. Projects, skills, and contact." />
  <link rel="canonical" href="https://portfolio-weiming.vercel.app/" />
  <meta name="theme-color" content="#fbcb0a" />

  <!-- Open Graph (link previews on LinkedIn, Facebook, Slack, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Weiming Hung — Frontend Developer" />
  <meta property="og:description" content="Full-stack developer portfolio — React, Next.js, and Flask." />
  <meta property="og:url" content="https://portfolio-weiming.vercel.app/" />
  <meta property="og:image" content="https://portfolio-weiming.vercel.app/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Structured data: Person schema for rich results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Weiming Hung",
    "jobTitle": "Frontend Developer",
    "url": "https://portfolio-weiming.vercel.app/",
    "knowsAbout": ["React", "Next.js", "TypeScript", "Flask", "CSS"],
    "sameAs": [
      "https://github.com/wmhung"
    ]
  }
  </script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") || "light";
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        d.style.colorScheme = t === "dark" ? "dark" : "light";
        d.style.background = t === "dark" ? "#161616" : "#f4f4f2";
        var lang = localStorage.getItem("lang") || "en";
        d.setAttribute("lang", lang === "zh" ? "zh-Hant" : "en");
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
